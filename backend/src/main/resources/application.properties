spring.application.name=gestion-marches
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/gestion_marches_db
spring.datasource.username=postgres
spring.datasource.password=postgresql
server.port=8081
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Augmenter la limite pour un seul fichier (ex: 10 Mo)
spring.servlet.multipart.max-file-size=10MB

# Augmenter la limite globale de la requête avec plusieurs fichiers (ex: 50 Mo)
spring.servlet.multipart.max-request-size=50MB